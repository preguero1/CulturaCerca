<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CulturaCerca: descubre, filtra, guarda y reserva eventos culturales cercanos.">
<title>CulturaCerca</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-8-4.8-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6.2-8 11-8 11z"/></symbol>
<symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 0 4 2 2 0 0 1 0 4v1h18v-1a2 2 0 0 1 0-4 2 2 0 0 1 0-4V7H3z"/><path d="M14 7v10" stroke-dasharray="2 2"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
<symbol id="i-access" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="1.8"/><path d="M5 8.5h14M12 8.5V14l-3 6M12 14l3 6"/></symbol>
</defs></svg>

<a class="skip" href="#main">Saltar al contenido</a>
<header class="top">
  <a class="brand" href="#/">CulturaCerca</a>
  <nav id="nav" aria-label="Principal">
    <a href="#/" data-r="home"><svg><use href="#i-home"/></svg><span>Inicio</span></a>
    <a href="#/lista" data-r="lista"><svg><use href="#i-heart"/></svg><span>Mi lista</span></a>
    <a href="#/entradas" data-r="entradas"><svg><use href="#i-ticket"/></svg><span>Mis entradas</span></a>
  </nav>
</header>

<main id="main" tabindex="-1">
  <section data-view="home">
    <h1 tabindex="-1">Eventos culturales cerca de ti</h1>
    <div class="bar">
      <div class="search"><svg><use href="#i-search"/></svg>
        <label for="q" class="sr">Buscar eventos o lugares</label>
        <input id="q" type="search" placeholder="Buscar eventos, lugares…" autocomplete="off"></div>
      <button id="open-f" class="ib" type="button" aria-label="Abrir filtros" aria-expanded="false" aria-controls="filtros"><svg><use href="#i-sliders"/></svg></button>
    </div>
    <div class="layout">
      <div id="scrim" hidden></div>
      <aside id="filtros" aria-labelledby="f-title">
        <form id="f">
          <div class="row"><h2 id="f-title">Filtros</h2>
            <button id="close-f" class="ib" type="button" aria-label="Cerrar filtros"><svg><use href="#i-x"/></svg></button></div>
          <fieldset><legend>Categoría</legend><div class="chips" id="cats"></div></fieldset>
          <fieldset><legend>Fecha</legend><div class="chips">
            <label class="chip"><input type="radio" name="when" value="all" checked><span>Todas</span></label>
            <label class="chip"><input type="radio" name="when" value="today"><span>Hoy</span></label>
            <label class="chip"><input type="radio" name="when" value="tomorrow"><span>Mañana</span></label>
            <label class="chip"><input type="radio" name="when" value="weekend"><span>Fin de semana</span></label></div></fieldset>
          <fieldset><legend>Ubicación</legend>
            <label for="km">Distancia máxima: <output id="kmo" for="km">10 km</output></label>
            <input id="km" name="km" type="range" min="1" max="25" value="10"></fieldset>
          <fieldset><legend>Más opciones</legend>
            <label class="sw"><input type="checkbox" name="free"><span>Solo eventos gratuitos</span></label>
            <label class="sw"><input type="checkbox" name="acc"><span>Con accesibilidad para silla de ruedas</span></label></fieldset>
          <div class="row2"><button type="reset" class="btn sec">Limpiar</button>
            <button type="button" id="apply" class="btn">Ver eventos</button></div>
        </form>
      </aside>
      <div>
        <p id="count" aria-live="polite"></p>
        <ul id="cards" class="cards"></ul>
      </div>
    </div>
  </section>
  <section data-view="evento" hidden></section>
  <section data-view="reserva" hidden></section>
  <section data-view="lista" hidden></section>
  <section data-view="entradas" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
